<style>
:root{--mid:#071316;--sf:#0D1C21;--ev:#103B40;--cy:#00DCE8;--li:#C6FF36;--tx:#EDF6F3;--mu:#91A5A5;--bd:#243A40;--am:#F0BD56;--er:#FF7777;--r:14px;
--sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;--ser:'Source Serif 4',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0}html{-webkit-text-size-adjust:100%}
body{background:var(--mid);color:var(--tx);font:400 15px/1.45 var(--sans);min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom));overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.mono,.od b,.sc,.clk{font-family:var(--mono);font-variant-numeric:tabular-nums}
.serif{font-family:var(--ser)}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(7,19,22,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.02em}
.brand img{width:34px;height:34px;border-radius:8px}.brand span b{color:var(--cy)}
header nav{display:none;gap:4px;margin-left:18px}
header nav a{padding:8px 14px;border-radius:99px;color:var(--mu);font-weight:500}
header nav a[aria-current=page]{background:var(--ev);color:var(--tx)}
.sp{flex:1}.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--cy);color:#001014;font-weight:700;border:0}
.pill i{font-style:normal;background:#001014;color:var(--cy);border-radius:99px;padding:0 7px;font-family:var(--mono);font-size:13px}
.layout{max-width:1380px;margin:0 auto;display:block}
.rail{display:none}
main{padding:16px;min-width:0}
h2.sec{font-size:13px;color:var(--mu);font-weight:600;letter-spacing:.02em;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center}
.hero{position:relative;border-radius:22px;overflow:hidden;padding:28px 20px 22px;background:linear-gradient(180deg,rgba(7,19,22,.25),var(--mid) 96%),var(--bg) center/cover,var(--ev);border:1px solid var(--bd);min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px}
.hero h1{font-family:var(--ser);font-size:clamp(34px,8vw,64px);line-height:1;letter-spacing:-.02em;max-width:14ch}
.hero h1 em{color:var(--cy)}.hero p{color:var(--mu);max-width:44ch}
.search{display:flex;align-items:center;gap:8px;background:rgba(13,28,33,.9);border:1px solid var(--bd);border-radius:99px;padding:4px 6px 4px 16px;max-width:560px}
.search input{flex:1;background:none;border:0;color:var(--tx);font:inherit;padding:10px 0;min-width:0}.search input:focus{outline:0}
.search:focus-within{border-color:var(--cy)}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:none;padding:8px 15px;border-radius:99px;border:1px solid var(--bd);background:var(--sf);color:var(--mu);font-weight:500;white-space:nowrap}
.chip[aria-pressed=true],.chip[aria-current=true]{background:var(--ev);color:var(--tx);border-color:var(--cy)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
.lc{flex:none;width:min(320px,84vw);background:linear-gradient(160deg,var(--ev),var(--sf) 70%);border:1px solid var(--bd);border-radius:18px;padding:14px;display:grid;gap:12px}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);gap:8px}
.live{color:var(--li);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--li);box-shadow:0 0 0 0 var(--li);animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 7px transparent}}
.cr{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:#06100f;font:700 10px var(--mono);font-style:normal;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.tms{display:grid;gap:8px}.t{display:flex;align-items:center;gap:10px;font-weight:600}.t .sc{margin-left:auto;font-size:20px}
.odds{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.od{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px;min-height:48px;border-radius:10px;background:#0a1a1e;border:1px solid var(--bd);transition:border-color .15s,background .15s}
.od small{color:var(--mu);font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.od b{font-size:16px}
.od:hover{border-color:var(--cy)}
.od[aria-pressed=true]{background:var(--cy);color:#001014;border-color:var(--cy)}.od[aria-pressed=true] small{color:#04383d}
.od[aria-pressed=true]:after{content:"✓";position:absolute;top:2px;right:6px;font-size:10px;font-weight:700}
.od.chg b{color:var(--am)}.od[aria-pressed=true].chg b{color:#5a3a00}
.od.chg small:after{content:" ▼ moved";color:var(--am)}
.od[disabled]{opacity:.55;cursor:not-allowed;background:repeating-linear-gradient(135deg,#0a1a1e 0 6px,#0d2026 6px 12px)}.od[disabled] b{font-size:12px}
.fx{display:grid;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd)}.fx:last-child{border:0}
.fx.big{background:linear-gradient(100deg,var(--ev),transparent);padding:16px 14px}
.fx .tm{display:grid;gap:8px}
.ch{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--bd);background:var(--sf)}
.ch h3{font-size:17px}.ch small{color:var(--mu);display:block}
.cb{width:42px;height:42px;border-radius:12px;background:var(--ev);display:grid;place-items:center;font:700 14px var(--mono);color:var(--cy)}
.fol{margin-left:auto;padding:7px 12px;border-radius:99px;border:1px solid var(--bd);background:none;font-size:13px;font-weight:600}
.fol[aria-pressed=true]{background:var(--li);color:#101c00;border-color:var(--li)}
.list{border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;background:var(--sf);margin-bottom:16px}
.ban{position:relative;border-radius:20px;overflow:hidden;min-height:170px;display:flex;align-items:flex-end;padding:20px;background:linear-gradient(90deg,var(--mid) 12%,transparent 70%),var(--bg) right center/cover,var(--ev);border:1px solid var(--bd);margin-bottom:14px}
.ban h1{font-family:var(--ser);font-size:clamp(30px,7vw,52px);line-height:1}.ban p{color:var(--mu)}
.empty{text-align:center;padding:28px 16px;color:var(--mu)}.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:4px}
.sb{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--bd);padding:18px 14px 16px;background:linear-gradient(180deg,rgba(7,19,22,.55),var(--mid)),var(--bg) center/cover,var(--ev);text-align:center}
.sb .cmp{color:var(--mu);font-size:13px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.sbm{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:16px 0 10px}
.tk{display:grid;justify-items:center;gap:8px;font-weight:700;font-size:15px}.tk .cr{width:56px;height:56px;font-size:15px}
.tk button{background:none;border:0;color:var(--mu);font-size:12px;padding:2px 8px;border-radius:99px}.tk button[aria-pressed=true]{color:var(--li)}
.sc{font-size:clamp(40px,11vw,68px);font-weight:600;letter-spacing:-.03em;line-height:1;background:rgba(7,19,22,.7);border:1px solid var(--bd);border-radius:16px;padding:10px 18px}
.sc i{color:var(--mu);font-style:normal;margin:0 6px}
.clk{font-size:15px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:16px 0 12px;position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:5;background:var(--mid);padding:8px 0;scrollbar-width:none}
.tabs button{flex:none;padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--mu);font-weight:600}
.tabs button[aria-selected=true]{background:var(--ev);color:var(--tx);border-color:var(--cy);box-shadow:inset 0 -3px var(--cy)}
.mk{margin-bottom:12px}.mk h4{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:8px}
.sus{font-size:11px;font-weight:700;color:var(--er);border:1px solid var(--er);border-radius:6px;padding:2px 7px}
.mk .odds{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.dm{border:1px dashed var(--bd);border-radius:var(--r);padding:12px;margin-top:14px}.dm summary{font-weight:600;cursor:pointer}
.dm .row{margin-top:10px;flex-wrap:wrap}.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);font-weight:600;font-size:13px}.btn[aria-pressed=true]{border-color:var(--am);color:var(--am)}
.btn.pri{background:var(--cy);color:#001014;border-color:var(--cy)}.btn.li{background:var(--li);color:#101c00;border-color:var(--li)}.btn.dg{border-color:var(--er);color:var(--er)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid2{display:grid;gap:16px}
.tkt{border:1px solid var(--bd);border-left:4px solid var(--cy);border-radius:12px;background:var(--sf);padding:12px;display:grid;gap:8px;position:relative;margin-bottom:10px}
.tkt.bad{border-left-color:var(--er)}.tkt.ch2{border-left-color:var(--am)}
.tkt .h{display:flex;justify-content:space-between;gap:8px}.tkt .h small,.tkt p{color:var(--mu);font-size:13px}
.x{background:none;border:0;color:var(--mu);font-size:18px;min-width:32px;min-height:32px}
.nt{font-size:13px;border-radius:8px;padding:8px 10px}.nt.am{background:rgba(240,189,86,.12);color:var(--am)}.nt.er{background:rgba(255,119,119,.12);color:var(--er)}.nt.ok{background:rgba(198,255,54,.1);color:var(--li)}
.stk{display:flex;align-items:center;gap:8px}.stk input{flex:1;min-width:0;background:var(--mid);border:1px solid var(--bd);border-radius:10px;color:var(--tx);padding:10px;font:600 16px var(--mono)}
.stk input[aria-invalid=true]{border-color:var(--er)}.stk span{color:var(--mu);font-size:13px}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--mu)}.kv b{color:var(--tx);font-family:var(--mono)}
.life{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;font-weight:700;margin-bottom:10px}.life span{padding:3px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.life span.on{background:var(--ev);color:var(--tx);border-color:var(--cy)}.life span.on.w{color:var(--am);border-color:var(--am)}.life span.on.e{color:var(--er);border-color:var(--er)}.life span.on.g{color:var(--li);border-color:var(--li)}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}.st.open{color:var(--cy);border-color:var(--cy)}.st.won{color:var(--li);border-color:var(--li)}.st.lost{color:var(--er);border-color:var(--er)}.st.cashed{color:var(--am);border-color:var(--am)}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:50;padding:16px}
.mod>div{background:var(--sf);border:1px solid var(--cy);border-radius:18px;padding:20px;max-width:380px;width:100%;display:grid;gap:12px}
.ed{display:grid;gap:14px}.ed article{border-top:2px solid var(--cy);padding-top:10px}.ed h3{font-family:var(--ser);font-size:21px;line-height:1.15;margin-bottom:4px}.ed p{color:var(--mu);font-size:14px}
nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(7,19,22,.96);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
nav.bot a{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--mu);padding:6px 0;border-radius:10px;min-height:48px;position:relative}
nav.bot a[aria-current=page]{color:var(--cy)}nav.bot a svg{width:22px;height:22px}
nav.bot a.sl{background:var(--cy);color:#001014;font-weight:700;margin:0 4px}
.rs a{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
@media(min-width:768px){main{padding:24px}.grid2.c{grid-template-columns:1fr 1fr}.hero{padding:40px 36px}.lc{width:340px}}
@media(min-width:1024px){body{padding-bottom:0}nav.bot{display:none}header nav{display:flex}header.top{padding-inline:24px}
.layout{display:grid;grid-template-columns:210px 1fr}.rail{display:block;padding:24px 0 24px 20px;position:sticky;top:60px;align-self:start}
.rail a,.rail button{display:flex;width:100%;text-align:left;padding:9px 12px;border-radius:10px;color:var(--mu);background:none;border:0;font-weight:500}
.rail a:hover,.rail button:hover{background:var(--sf);color:var(--tx)}.rail h5{font-size:12px;color:var(--mu);margin:16px 12px 6px;font-weight:600}
.mpg{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}.aside{position:sticky;top:76px}}
@media(min-width:1024px){.mk .odds{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

img,svg{max-width:100%}.odds>*,.fx>*,.grid2>*,.mpg>*,.sbm>*,.t>*{min-width:0}
.t{min-width:0}.t span:not(.sc){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbm{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.tk{text-align:center;word-break:break-word}
.aside{display:none}.layout,main,.hero,.ban,.sb{max-width:100%}
nav.bot{align-items:end;overflow:visible}nav.bot a.hm{margin-top:-24px;color:var(--tx)}
nav.bot a.hm img{width:56px;height:56px;border-radius:50%;border:3px solid var(--mid);box-shadow:0 0 0 2px var(--cy),0 6px 20px rgba(0,220,232,.4)}
nav.bot a.hm[aria-current=page] img{box-shadow:0 0 0 2px var(--li),0 6px 20px rgba(198,255,54,.35)}
@media(max-width:380px){.sc{padding:8px 10px}.tk .cr{width:46px;height:46px}.od b{font-size:14px}header.top{gap:8px;padding-inline:12px}.brand{font-size:17px}}
@media(min-width:768px){.row.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));overflow:visible}.row.lg .lc{width:auto}.sbm{gap:24px}.mk .odds{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}}
@media(min-width:1024px){.aside{display:block}nav.bot{display:none}.list.two,.hero{max-width:100%}}
@media(min-width:1280px){main{padding:28px 36px}.hero{min-height:360px;padding:48px}}
nav.bot a.hm{margin-top:0}nav.bot a.hm img,nav.bot a.hm[aria-current=page] img{width:30px;height:30px;border:0;box-shadow:none;border-radius:50%}
nav.bot a .ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:box-shadow .2s,background .2s}
nav.bot a[aria-current=page] .ib{background:var(--ev);box-shadow:0 0 0 2px var(--cy),0 0 14px rgba(0,220,232,.55)}
